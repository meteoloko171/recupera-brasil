<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processando Transferência...</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #ffffff;
      margin: 0;
      padding: 20px 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1155cc;
      box-sizing: border-box;
    }

    .card {
      background: transparent;
      border: none;
      box-shadow: none;
      max-width: 480px;
      width: 100%;
      min-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 24px;
      box-sizing: border-box;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid rgba(17, 85, 204, 0.2);
      border-top: 4px solid #1155cc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      padding: 0 20px;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Encontrando dados do recebedor...</div>
  </div>

  <script>
    const texts = [
      "Encontrando dados do recebedor...",
      "Encontrando instituição...",
      "Instituição encontrada",
      "Transferência sendo enviada..."
    ];

    let currentIndex = 0;
    const textElement = document.getElementById('loadingText');

    const interval = setInterval(() => {
      currentIndex++;
      if (currentIndex < texts.length) {
        textElement.style.opacity = '0';
        setTimeout(() => {
          textElement.textContent = texts[currentIndex];
          textElement.style.opacity = '1';
        }, 300);
      } else {
        clearInterval(interval);
        setTimeout(() => {
          window.location.href = 'pagina3.html';
        }, 1500); // Aguarda um pouco antes de redirecionar no último texto
      }
    }, 2000);
  </script>
</body>
</html>
